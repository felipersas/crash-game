name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "latest"

jobs:
  unit-tests-games:
    name: Unit Tests - Games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun global
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: |
          cd packages/domain && bun run build
          cd ../messaging && bun run build
          cd ../observability && bun run build

      - run: cd services/games && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate

      - name: Run unit tests
        run: bun test services/games/tests/unit

  unit-tests-wallets:
    name: Unit Tests - Wallets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun global
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - run: |
          cd packages/domain && bun run build
          cd ../messaging && bun run build
          cd ../observability && bun run build

      - run: cd services/wallets && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate

      - name: Debug module resolution
        run: |
          echo "=== node_modules/@crash ==="
          ls -la node_modules/@crash/ 2>/dev/null || echo "NOT FOUND"
          echo "=== domain dist ==="
          ls packages/domain/dist/ 2>/dev/null || echo "NOT FOUND"
          echo "=== readlink ==="
          readlink -f node_modules/@crash/domain 2>/dev/null || echo "NOT A SYMLINK"

      - name: Run unit tests
        run: bun test services/wallets/tests/unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun global
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Check games formatting
        run: bun run --cwd services/games format:check

      - name: Check wallets formatting
        run: bun run --cwd services/wallets format:check

  e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-games, unit-tests-wallets, lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun global
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: |
          cd packages/domain && bun run build
          cd ../messaging && bun run build
          cd ../observability && bun run build

      - name: Run Games E2E tests
        run: bun test services/games/tests/e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"

      - name: Run Wallets E2E tests
        run: bun test services/wallets/tests/e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"
