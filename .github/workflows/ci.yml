name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-games:
    name: Unit Tests - Games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - run: bun install

      - run: |
          cd packages/domain && bunx tsc && ls dist/
          cd ../messaging && bunx tsc && ls dist/
          cd ../observability && bunx tsc && ls dist/

      - name: Link workspace packages
        run: |
          mkdir -p node_modules/@crash
          for pkg in domain messaging observability eslint-config prettier-config; do
            ln -s "$GITHUB_WORKSPACE/packages/$pkg" "node_modules/@crash/$pkg"
          done

      - run: cd services/games && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate

      - name: Debug linking
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la node_modules/@crash/ || true
          readlink node_modules/@crash/domain || true
          ls packages/domain/dist/ || true
          ls node_modules/@crash/domain/dist/ || true

      - name: Run unit tests
        run: cd services/games && bun test tests/unit

  unit-tests-wallets:
    name: Unit Tests - Wallets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - run: bun install

      - run: |
          cd packages/domain && bunx tsc && ls dist/
          cd ../messaging && bunx tsc && ls dist/
          cd ../observability && bunx tsc && ls dist/

      - name: Link workspace packages
        run: |
          mkdir -p node_modules/@crash
          for pkg in domain messaging observability eslint-config prettier-config; do
            ln -s "$GITHUB_WORKSPACE/packages/$pkg" "node_modules/@crash/$pkg"
          done

      - run: cd services/wallets && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate

      - name: Debug linking
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la node_modules/@crash/ || true
          readlink node_modules/@crash/domain || true
          ls packages/domain/dist/ || true
          ls node_modules/@crash/domain/dist/ || true

      - name: Run unit tests
        run: cd services/wallets && bun test tests/unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - run: bun install

      - name: Link workspace packages
        run: |
          mkdir -p node_modules/@crash
          ln -s "$GITHUB_WORKSPACE/packages/eslint-config" node_modules/@crash/eslint-config
          ln -s "$GITHUB_WORKSPACE/packages/prettier-config" node_modules/@crash/prettier-config

      - name: Check games formatting
        run: bun run --cwd services/games format:check

      - name: Check wallets formatting
        run: bun run --cwd services/wallets format:check

  e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-games, unit-tests-wallets, lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - run: bun install

      - run: |
          cd packages/domain && bunx tsc && ls dist/
          cd ../messaging && bunx tsc && ls dist/
          cd ../observability && bunx tsc && ls dist/

      - name: Link workspace packages
        run: |
          mkdir -p node_modules/@crash
          for pkg in domain messaging observability eslint-config prettier-config; do
            ln -s "$GITHUB_WORKSPACE/packages/$pkg" "node_modules/@crash/$pkg"
          done

      - name: Run Games E2E tests
        run: cd services/games && bun test tests/e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"

      - name: Run Wallets E2E tests
        run: cd services/wallets && bun test tests/e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"
