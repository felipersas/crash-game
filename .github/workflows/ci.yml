name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-games:
    name: Unit Tests - Games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Ensure workspace symlinks
        run: |
          mkdir -p node_modules/@crash
          ln -sf ../../packages/domain node_modules/@crash/domain
          ln -sf ../../packages/messaging node_modules/@crash/messaging
          ln -sf ../../packages/observability node_modules/@crash/observability
          ln -sf ../../packages/eslint-config node_modules/@crash/eslint-config
          ln -sf ../../packages/prettier-config node_modules/@crash/prettier-config

      - run: |
          cd packages/domain && bun run build
          cd ../messaging && bun run build
          cd ../observability && bun run build

      - run: cd services/games && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate

      - name: Run unit tests
        run: bun test services/games/tests/unit

  unit-tests-wallets:
    name: Unit Tests - Wallets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Ensure workspace symlinks
        run: |
          mkdir -p node_modules/@crash
          ln -sf ../../packages/domain node_modules/@crash/domain
          ln -sf ../../packages/messaging node_modules/@crash/messaging
          ln -sf ../../packages/observability node_modules/@crash/observability
          ln -sf ../../packages/eslint-config node_modules/@crash/eslint-config
          ln -sf ../../packages/prettier-config node_modules/@crash/prettier-config

      - run: |
          cd packages/domain && bun run build
          cd ../messaging && bun run build
          cd ../observability && bun run build

      - run: cd services/wallets && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate

      - name: Run unit tests
        run: bun test services/wallets/tests/unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --backend=hardlink

      - name: Check games formatting
        run: bun run --cwd services/games format:check

      - name: Check wallets formatting
        run: bun run --cwd services/wallets format:check

  e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-games, unit-tests-wallets, lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Ensure workspace symlinks
        run: |
          mkdir -p node_modules/@crash
          ln -sf ../../packages/domain node_modules/@crash/domain
          ln -sf ../../packages/messaging node_modules/@crash/messaging
          ln -sf ../../packages/observability node_modules/@crash/observability
          ln -sf ../../packages/eslint-config node_modules/@crash/eslint-config
          ln -sf ../../packages/prettier-config node_modules/@crash/prettier-config

      - run: |
          cd packages/domain && bun run build
          cd ../messaging && bun run build
          cd ../observability && bun run build

      - name: Run Games E2E tests
        run: bun test services/games/tests/e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"

      - name: Run Wallets E2E tests
        run: bun test services/wallets/tests/e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"
