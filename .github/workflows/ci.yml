name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.3"

jobs:
  # ---------------------------------------------------------------------------
  # Install dependencies, build shared packages, generate Prisma clients
  # ---------------------------------------------------------------------------
  install:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v4
        id: cache-bun
        with:
          path: |
            node_modules
            services/*/node_modules
            packages/*/node_modules
            frontend/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build shared packages
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: |
          cd packages/domain && bun run build
          cd ../messaging && bun run build
          cd ../observability && bun run build

      - name: Generate Prisma clients
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: |
          cd services/games && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate
          cd ../wallets && DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" bunx prisma generate

  # ---------------------------------------------------------------------------
  # Unit Tests - Games Service
  # ---------------------------------------------------------------------------
  unit-tests-games:
    name: Unit Tests - Games
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/*/node_modules
            packages/*/node_modules
            frontend/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Run unit tests
        working-directory: services/games
        run: bun test tests/unit

  # ---------------------------------------------------------------------------
  # Unit Tests - Wallets Service
  # ---------------------------------------------------------------------------
  unit-tests-wallets:
    name: Unit Tests - Wallets
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/*/node_modules
            packages/*/node_modules
            frontend/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Run unit tests
        working-directory: services/wallets
        run: bun test tests/unit

  # ---------------------------------------------------------------------------
  # Lint / Format check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/*/node_modules
            packages/*/node_modules
            frontend/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Lint games service
        working-directory: services/games
        run: bun run format:check

      - name: Lint wallets service
        working-directory: services/wallets
        run: bun run format:check

  # ---------------------------------------------------------------------------
  # E2E Tests (Testcontainers)
  # Each service's E2E suite spins up its own docker-compose.test.yml
  # environment via Testcontainers. Run sequentially in same job.
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-games, unit-tests-wallets, lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/*/node_modules
            packages/*/node_modules
            frontend/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Run Games E2E tests
        working-directory: services/games
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"
        run: bun test tests/e2e

      - name: Run Wallets E2E tests
        working-directory: services/wallets
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_BUILDKIT: "1"
        run: bun test tests/e2e
