_format_version: "3.0"

services:
  - name: games-service
    url: http://games:4001
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:3000", "http://localhost:5173"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "Origin"]
          exposed_headers: ["Content-Length", "Content-Type"]
          credentials: true
          max_age: 3600
    routes:
      - name: games-health
        paths: [/games/health]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: consumer
      - name: games-rounds-current
        paths: [/games/rounds/current]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 10
              minute: 120
              policy: local
              limit_by: consumer
      - name: games-rounds-history
        paths: [/games/rounds/history]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 5
              minute: 60
              policy: local
              limit_by: consumer
      - name: games-rounds-verify
        paths: [/games/rounds]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 5
              minute: 60
              policy: local
              limit_by: consumer
      - name: games-bets-me
        paths: [/games/bets/me]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 5
              minute: 60
              policy: local
              limit_by: consumer
          - name: oidc
            config:
              client_id: crash-game-client
              discovery: http://keycloak:8080/realms/crash-game/.well-known/openid-configuration
              bearer_only: "yes"
              realm: crash-game
              scope: openid
              ssl_verify: "yes"
      - name: games-bet
        paths: [/games/bet]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 3
              minute: 30
              policy: local
              limit_by: consumer
          - name: oidc
            config:
              client_id: crash-game-client
              discovery: http://keycloak:8080/realms/crash-game/.well-known/openid-configuration
              bearer_only: "yes"
              realm: crash-game
              scope: openid
              ssl_verify: "yes"
      - name: games-bet-cashout
        paths: [/games/bet/cashout]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              second: 3
              minute: 30
              policy: local
              limit_by: consumer
          - name: oidc
            config:
              client_id: crash-game-client
              discovery: http://keycloak:8080/realms/crash-game/.well-known/openid-configuration
              bearer_only: "yes"
              realm: crash-game
              scope: openid
              ssl_verify: "yes"
      - name: games-api-docs
        paths: [/games/api-docs]
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Origin"]
              credentials: false
              max_age: 3600
      - name: games-websocket
        paths: [/games]
        strip_path: true
        protocols: [http, https]
        plugins:
          - name: cors
            config:
              origins:
                [
                  "http://localhost:3000",
                  "http://localhost:5173",
                  "http://localhost:8000",
                ]
              methods: ["GET", "POST", "OPTIONS"]
              headers:
                [
                  "Accept",
                  "Authorization",
                  "Content-Type",
                  "Origin",
                  "X-Requested-With",
                ]
              exposed_headers: ["*"]
              credentials: true
              max_age: 3600
      - name: games-websocket-root
        paths: [/socket.io]
        strip_path: false
        protocols: [http, https]
        plugins:
          - name: cors
            config:
              origins: ["http://localhost:3000", "http://localhost:5173"]
              methods: ["GET", "POST", "OPTIONS"]
              headers: ["Accept", "Authorization", "Content-Type", "Origin"]
              exposed_headers: ["Content-Length", "Content-Type"]
              credentials: true
              max_age: 3600

  - name: wallets-service
    url: http://wallets:4002
    plugins:
      - name: rate-limiting
        config:
          second: 15
          minute: 100
          hour: 2000
          policy: local
          limit_by: consumer
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: "Rate limit exceeded. Please slow down."
      - name: cors
        config:
          origins: ["http://localhost:3000", "http://localhost:5173"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "Origin"]
          exposed_headers: ["Content-Length", "Content-Type"]
          credentials: true
          max_age: 3600
    routes:
      - name: wallets-health
        paths: [/wallets/health]
        strip_path: false
      - name: wallets-me
        paths: [/wallets/me]
        strip_path: false
        plugins:
          - name: oidc
            config:
              client_id: crash-game-client
              discovery: http://keycloak:8080/realms/crash-game/.well-known/openid-configuration
              bearer_only: "yes"
              realm: crash-game
              scope: openid
              ssl_verify: "yes"
      - name: wallets-create
        paths: [/wallets]
        strip_path: false
        methods: [POST]
        plugins:
          - name: oidc
            config:
              client_id: crash-game-client
              discovery: http://keycloak:8080/realms/crash-game/.well-known/openid-configuration
              bearer_only: "yes"
              realm: crash-game
              scope: openid
              ssl_verify: "yes"
      - name: wallets-api-docs
        paths: [/wallets/api-docs]
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Origin"]
              credentials: false
              max_age: 3600

  - name: api-docs
    url: http://api-docs:8088
    routes:
      - name: docs-ui
        paths: [/docs]
        strip_path: true
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Origin"]
              credentials: false
              max_age: 3600
